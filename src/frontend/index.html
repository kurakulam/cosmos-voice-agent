<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COSMOS – Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #050810;
      --surface:  #0c1220;
      --border:   rgba(255,255,255,0.07);
      --accent:   #4f9eff;
      --accent2:  #a78bfa;
      --green:    #34d399;
      --red:      #f87171;
      --text:     #e2e8f0;
      --dim:      #64748b;
    }

    html, body {
      height: 100%; background: var(--bg);
      color: var(--text); font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    /* ── Stars ── */
    canvas#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── Layout ── */
    .app {
      position: relative; z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 20px;
      gap: 20px;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 20px; font-weight: 800; letter-spacing: 0.15em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .conn-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--dim);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px;
      transition: all 0.3s;
    }
    .conn-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--dim); transition: background 0.3s;
    }
    .conn-badge.connected .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .conn-badge.connected { color: var(--text); }
    .conn-badge.listening .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1s infinite; }
    .conn-badge.speaking .dot { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation: pulse 0.6s infinite; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── Transcript ── */
    .transcript {
      overflow-y: auto; display: flex; flex-direction: column;
      gap: 12px; padding: 4px 0;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .transcript:empty::before {
      content: 'Start talking — COSMOS is listening';
      color: var(--dim); font-size: 14px;
      text-align: center; margin: auto;
      display: block; padding-top: 40%;
    }
    .msg {
      max-width: 85%; padding: 10px 14px;
      border-radius: 16px; font-size: 14px; line-height: 1.5;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: none; } }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #1e3a5f, #1a2d50);
      border: 1px solid rgba(79,158,255,0.2);
      color: #93c5fd;
    }
    .msg.cosmos {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .msg.interim {
      align-self: flex-end;
      background: rgba(79,158,255,0.08);
      border: 1px dashed rgba(79,158,255,0.3);
      color: var(--dim); font-style: italic;
    }

    /* ── Bottom controls ── */
    .controls {
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
    }

    /* ── Waveform ── */
    .waveform {
      display: flex; align-items: center; gap: 3px;
      height: 32px; opacity: 0;
      transition: opacity 0.3s;
    }
    .waveform.active { opacity: 1; }
    .wave-bar {
      width: 3px; border-radius: 3px;
      background: var(--accent);
      height: 4px;
      transition: height 0.1s, background 0.3s;
    }

    /* ── Big mic button ── */
    .mic-wrap {
      position: relative; display: flex;
      align-items: center; justify-content: center;
    }
    .mic-ring {
      position: absolute;
      width: 88px; height: 88px; border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0; transform: scale(1);
      transition: opacity 0.3s;
    }
    .mic-btn {
      width: 72px; height: 72px; border-radius: 50%;
      border: none; cursor: pointer;
      background: var(--surface);
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; position: relative; z-index: 1;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .mic-btn:hover { border-color: var(--accent); transform: scale(1.04); }
    .mic-btn svg { width: 28px; height: 28px; transition: all 0.2s; }

    /* States */
    .mic-btn.idle svg { stroke: var(--dim); }
    .mic-btn.listening {
      background: rgba(79,158,255,0.12);
      border-color: var(--accent);
      box-shadow: 0 0 0 0 rgba(79,158,255,0.4);
      animation: micPulse 1.5s infinite;
    }
    .mic-btn.listening svg { stroke: var(--accent); }
    .mic-btn.listening ~ .mic-ring { opacity: 0.4; animation: ringPulse 1.5s infinite; }
    .mic-btn.speaking { background: rgba(167,139,250,0.1); border-color: var(--accent2); }
    .mic-btn.speaking svg { stroke: var(--accent2); }
    .mic-btn.connecting { opacity: 0.6; pointer-events: none; }

    @keyframes micPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(79,158,255,0.4); }
      50% { box-shadow: 0 0 0 12px rgba(79,158,255,0); }
    }
    @keyframes ringPulse {
      0%,100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0; }
    }

    .hint {
      font-size: 12px; color: var(--dim);
      height: 16px; text-align: center;
      transition: color 0.3s;
    }
    .hint.active { color: var(--accent); }
    .hint.speaking { color: var(--accent2); }

    /* ── End session button ── */
    .end-btn {
      background: none; border: 1px solid var(--border);
      color: var(--dim); font-size: 12px; font-family: inherit;
      padding: 6px 16px; border-radius: 20px; cursor: pointer;
      transition: all 0.2s; display: none;
    }
    .end-btn:hover { border-color: var(--red); color: var(--red); }
    .end-btn.visible { display: block; }
  </style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="app">
  <!-- Header -->
  <header>
    <div class="logo">COSMOS</div>
    <div class="conn-badge" id="badge">
      <div class="dot"></div>
      <span id="badgeText">Tap to connect</span>
    </div>
  </header>

  <!-- Transcript -->
  <div class="transcript" id="transcript"></div>

  <!-- Controls -->
  <div class="controls">
    <div class="waveform" id="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>

    <div class="mic-wrap">
      <div class="mic-ring" id="micRing"></div>
      <button class="mic-btn idle" id="micBtn" title="Click to start">
        <!-- Mic SVG -->
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </button>
    </div>

    <div class="hint" id="hint">Click to start talking to COSMOS</div>
    <button class="end-btn" id="endBtn">End session</button>
  </div>
</div>

<script>
// ── Stars background ───────────────────────────────────────────────────────
(function() {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize() {
    c.width = innerWidth; c.height = innerHeight;
    stars = Array.from({length: 120}, () => ({
      x: Math.random()*c.width, y: Math.random()*c.height,
      r: Math.random()*1.2+0.2, a: Math.random()
    }));
  }
  function draw() {
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s => {
      s.a += 0.003 * (Math.random()-0.5);
      s.a = Math.max(0.1, Math.min(0.8, s.a));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(180,200,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize(); addEventListener('resize', resize); draw();
})();

// ── Config ──────────────────────────────────────────────────────────────────
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/voice`;
const SAMPLE_RATE = 16000;

// ── Audio utils ─────────────────────────────────────────────────────────────
function pcmToBase64(float32) {
  const int16 = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++)
    int16[i] = Math.max(-32768, Math.min(32767, float32[i] * 32767));
  const bytes = new Uint8Array(int16.buffer);
  let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

function base64ToFloat32(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const int16 = new Int16Array(bytes.buffer);
  const f32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
  return f32;
}

// ── Playback ────────────────────────────────────────────────────────────────
let audioCtx = null, nextPlayTime = 0, audioQueue = [], isPlaying = false, drainTimer = null;

function ensureCtx() {
  if (!audioCtx) { audioCtx = new AudioContext({sampleRate:24000, latencyHint:'interactive'}); nextPlayTime = 0; }
}

function scheduleChunk(f32) {
  ensureCtx();
  const buf = audioCtx.createBuffer(1, f32.length, 24000);
  buf.copyToChannel(f32, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (nextPlayTime < now + 0.08) nextPlayTime = now + 0.08;
  src.start(nextPlayTime);
  nextPlayTime += buf.duration;
}

function drainQueue() {
  ensureCtx();
  isPlaying = true;
  while (audioQueue.length) scheduleChunk(audioQueue.shift());
  if (drainTimer) clearInterval(drainTimer);
  drainTimer = setInterval(() => {
    while (audioQueue.length) scheduleChunk(audioQueue.shift());
    if (!audioQueue.length && nextPlayTime <= audioCtx.currentTime + 0.05) {
      clearInterval(drainTimer); drainTimer = null; isPlaying = false;
      if (sessionActive) { unmuteMic(); setMode('listening'); }
    }
  }, 10);
}

// ── Recording ───────────────────────────────────────────────────────────────
let micStream = null, micProcessor = null, micSource = null, micCtx = null;

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { sampleRate: SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true }
  });
  micCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
  micSource = micCtx.createMediaStreamSource(micStream);
  micProcessor = micCtx.createScriptProcessor(4096, 1, 1);
  micProcessor.onaudioprocess = e => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'audio', data: pcmToBase64(e.inputBuffer.getChannelData(0)) }));
  };
  micSource.connect(micProcessor);
  micProcessor.connect(micCtx.destination);
}

function stopMic() {
  if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
  if (micSource) { micSource.disconnect(); micSource = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micCtx) { micCtx.close(); micCtx = null; }
}

function muteMic() {
  if (micProcessor) micProcessor.disconnect();
}

function unmuteMic() {
  if (micProcessor && micSource) {
    try {
      micSource.connect(micProcessor);
      micProcessor.connect(micCtx.destination);
    } catch(e) {}
  }
}

// ── Waveform ────────────────────────────────────────────────────────────────
const waveEl = document.getElementById('waveform');
const bars = waveEl.querySelectorAll('.wave-bar');
let waveTimer = null;

function startWave(color) {
  waveEl.classList.add('active');
  if (waveTimer) clearInterval(waveTimer);
  waveTimer = setInterval(() => {
    bars.forEach(b => {
      const h = Math.random() * 22 + 4;
      b.style.height = h + 'px';
      b.style.background = color;
    });
  }, 80);
}

function stopWave() {
  waveEl.classList.remove('active');
  if (waveTimer) { clearInterval(waveTimer); waveTimer = null; }
  bars.forEach(b => { b.style.height = '4px'; });
}

// ── UI state ────────────────────────────────────────────────────────────────
const micBtn  = document.getElementById('micBtn');
const hint    = document.getElementById('hint');
const badge   = document.getElementById('badge');
const badgeText = document.getElementById('badgeText');
const endBtn  = document.getElementById('endBtn');
const transcript = document.getElementById('transcript');

function setMode(mode) {
  micBtn.className = 'mic-btn ' + mode;
  badge.className = 'conn-badge';
  hint.className = 'hint';

  if (mode === 'idle') {
    badgeText.textContent = 'Tap to connect';
    hint.textContent = 'Click to start talking to COSMOS';
    stopWave(); endBtn.classList.remove('visible');
  } else if (mode === 'connecting') {
    badgeText.textContent = 'Connecting…';
    hint.textContent = 'Connecting…';
    stopWave();
  } else if (mode === 'listening') {
    badge.classList.add('connected', 'listening');
    badgeText.textContent = 'Listening';
    hint.className = 'hint active';
    hint.textContent = 'Speak now — COSMOS is listening';
    startWave('var(--accent)');
    endBtn.classList.add('visible');
  } else if (mode === 'speaking') {
    badge.classList.add('connected', 'speaking');
    badgeText.textContent = 'Responding';
    hint.className = 'hint speaking';
    hint.textContent = 'COSMOS is responding…';
    startWave('var(--accent2)');
    endBtn.classList.add('visible');
  } else if (mode === 'connected') {
    badge.classList.add('connected');
    badgeText.textContent = 'Connected';
    hint.textContent = 'Speak anytime…';
    stopWave();
    endBtn.classList.add('visible');
  }
}

// ── Transcript ───────────────────────────────────────────────────────────────
let interimEl = null;

function addMsg(text, role) {
  if (!text.trim()) return;
  if (role === 'interim') {
    if (!interimEl) {
      interimEl = document.createElement('div');
      interimEl.className = 'msg interim';
      transcript.appendChild(interimEl);
    }
    interimEl.textContent = text;
  } else {
    if (interimEl) { interimEl.remove(); interimEl = null; }
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    transcript.appendChild(el);
  }
  transcript.scrollTop = transcript.scrollHeight;
}

// ── WebSocket session ────────────────────────────────────────────────────────
let ws = null, sessionActive = false;

async function startSession() {
  setMode('connecting');
  ws = new WebSocket(WS_URL);

  ws.onopen = async () => {
    ws.send(JSON.stringify({ type: 'start' }));
    sessionActive = true;
    try {
      await startMic();
      setMode('listening');
    } catch(e) {
      addMsg('Microphone access denied. Please allow mic and reload.', 'cosmos');
      setMode('idle'); endSession();
    }
  };

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'audio') {
      audioQueue.push(base64ToFloat32(msg.data));
      if (!isPlaying) {
        muteMic();          // stop sending mic while COSMOS speaks
        setMode('speaking');
        drainQueue();
      }
    }
    if (msg.type === 'transcript') {
      if (msg.final && msg.text) addMsg(msg.text, 'cosmos');
      else if (msg.text) addMsg(msg.text, 'interim');
    }
    if (msg.type === 'done') endSession();
    if (msg.type === 'error') {
      addMsg('Error: ' + msg.message, 'cosmos');
      setMode('connected');
    }
  };

  ws.onclose = () => { sessionActive = false; stopMic(); setMode('idle'); };
  ws.onerror = () => { addMsg('Connection failed. Please try again.', 'cosmos'); setMode('idle'); };
}

function endSession() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'stop' }));
    ws.close();
  }
  stopMic(); sessionActive = false;
  setMode('idle');
}

// ── Single button interaction ────────────────────────────────────────────────
micBtn.addEventListener('click', () => {
  if (!sessionActive) startSession();
  // Once connected, mic is always on — nothing else to click
});

endBtn.addEventListener('click', endSession);

// ── Init ─────────────────────────────────────────────────────────────────────
setMode('idle');
</script>
</body>
</html>
