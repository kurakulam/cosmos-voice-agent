name: COSMOS Voice Agent – CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_LOCATION:   ${{ secrets.GCP_LOCATION || 'us-central1' }}
  IMAGE_NAME:     gcr.io/${{ secrets.GCP_PROJECT_ID }}/cosmos-voice-agent

jobs:
  # ── Lint & Test ──────────────────────────────────────────────────────────
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r src/backend/requirements.txt
          pip install pytest pytest-asyncio httpx numpy

      - name: Run unit tests
        run: |
          cd src/backend
          python -m pytest ../../tests/ -v --tb=short \
            --ignore=../../tests/test_backend.py \
            -k "not integration"
        env:
          PYTHONPATH: .

      - name: Run all unit tests
        run: |
          python -m pytest tests/ -v --tb=short -k "not integration"
        env:
          PYTHONPATH: src/backend

  # ── Build Docker Image ───────────────────────────────────────────────────
  build:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Copy frontend assets into backend
        run: |
          mkdir -p src/backend/frontend/dist
          cp src/frontend/index.html src/backend/frontend/dist/index.html

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE_NAME:$GITHUB_SHA \
                       -t $IMAGE_NAME:latest \
                       ./src/backend
          docker push $IMAGE_NAME:$GITHUB_SHA
          docker push $IMAGE_NAME:latest

  # ── Deploy to Cloud Run ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy cosmos-voice-agent \
            --image="${IMAGE_NAME}:${GITHUB_SHA}" \
            --region="${GCP_LOCATION}" \
            --platform=managed \
            --service-account="${{ secrets.SERVICE_ACCOUNT_EMAIL }}" \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=3600 \
            --set-env-vars="GCP_PROJECT_ID=${GCP_PROJECT_ID}" \
            --set-env-vars="GCP_LOCATION=${GCP_LOCATION}" \
            --set-env-vars="VERTEX_SEARCH_DATASTORE_ID=${{ secrets.VERTEX_SEARCH_DATASTORE_ID }}" \
            --set-env-vars="GEMINI_MODEL=${{ secrets.GEMINI_MODEL || 'gemini-2.0-flash-live-preview' }}" \
            --set-env-vars="GEMINI_VOICE=${{ secrets.GEMINI_VOICE || 'Aoede' }}" \
            --set-env-vars="RAG_TOP_K=${{ secrets.RAG_TOP_K || '5' }}" \
            --set-env-vars="DEBUG=false" \
            --project="${GCP_PROJECT_ID}" \
            --quiet

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe cosmos-voice-agent \
            --region="${GCP_LOCATION}" \
            --project="${GCP_PROJECT_ID}" \
            --format="value(status.url)")
          echo "✓ Deployed: ${URL}"
          echo "SERVICE_URL=${URL}" >> $GITHUB_STEP_SUMMARY

  # ── PR Preview Deploy ────────────────────────────────────────────────────
  preview:
    name: Deploy PR Preview
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy PR preview
        run: |
          PR_SERVICE="cosmos-pr-${{ github.event.number }}"
          gcloud run deploy "${PR_SERVICE}" \
            --image="${IMAGE_NAME}:${GITHUB_SHA}" \
            --region="${GCP_LOCATION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --max-instances=2 \
            --set-env-vars="GCP_PROJECT_ID=${GCP_PROJECT_ID}" \
            --set-env-vars="GCP_LOCATION=${GCP_LOCATION}" \
            --set-env-vars="VERTEX_SEARCH_DATASTORE_ID=${{ secrets.VERTEX_SEARCH_DATASTORE_ID }}" \
            --set-env-vars="GEMINI_MODEL=gemini-2.0-flash-live-preview" \
            --set-env-vars="DEBUG=true" \
            --project="${GCP_PROJECT_ID}" \
            --quiet
